<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizzle Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Load Shared Data & Logic -->
    <script src="assets/data/translations.js"></script>
    <script src="assets/js/knowledge-base.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .login-overlay { position: fixed; inset: 0; background: #1a1a1a; z-index: 50; display: flex; align-items: center; justify-content: center; }
        .glass-panel { background: white; border: 1px solid #e5e7eb; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 0.5rem; color: #4b5563; transition: all 0.2s; cursor: pointer; }
        .sidebar-link:hover, .sidebar-link.active { background-color: #6b3d92; color: white; }
        .btn-primary { background-color: #6b3d92; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; transition: background 0.2s; }
        .btn-primary:hover { background-color: #5a327a; }
        .btn-secondary { background-color: white; border: 1px solid #d1d5db; color: #374151; padding: 0.5rem 1rem; border-radius: 0.375rem; transition: background 0.2s; }
        .btn-secondary:hover { background-color: #f9fafb; }
        .btn-danger { background-color: #ef4444; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; transition: background 0.2s; }
        .btn-danger:hover { background-color: #dc2626; }
        /* Table Styles */
        .trans-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        .trans-table th { text-align: left; padding: 0.75rem; background: #f9fafb; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; }
        .trans-table td { padding: 0.75rem; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
        .trans-input { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.25rem; font-size: 0.875rem; }
        .trans-input:focus { outline: none; border-color: #6b3d92; ring: 2px solid #6b3d92; }
        
        /* KB Table Styles */
        .kb-checkbox { width: 1rem; height: 1rem; color: #6b3d92; border-radius: 0.25rem; cursor: pointer; }
        .kb-row:hover { background-color: #f9fafb; }
        .kb-row.selected { background-color: #f3e8ff; }
        .sort-icon { display: inline-block; transition: transform 0.2s; }
        .sort-asc .sort-icon { transform: rotate(180deg); }
    </style>
</head>
<body>

    <!-- Login Overlay -->
    <div id="login-screen" class="login-overlay">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <img src="assets/img/logo/Vizzle.png" alt="Vizzle" class="h-12 mx-auto mb-4">
                <h1 class="text-2xl font-bold text-gray-800">Admin Portal</h1>
                <p class="text-gray-500 text-sm">請登入以管理系統</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Admin ID</label>
                    <input type="text" id="admin-id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#6b3d92] focus:border-transparent outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="admin-pass" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#6b3d92] focus:border-transparent outline-none" required>
                </div>
                <div id="login-error" class="text-red-500 text-sm text-center hidden">帳號或密碼錯誤</div>
                <button type="submit" class="w-full bg-[#6b3d92] text-white py-2.5 rounded-lg font-medium hover:bg-[#5a327a] transition-colors">登入系統</button>
            </form>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="flex h-screen overflow-hidden hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 flex flex-col">
            <div class="p-6 flex items-center justify-center border-b border-gray-100">
                <img src="assets/img/logo/Vizzle.png" alt="Vizzle" class="h-8">
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <div class="sidebar-link active" onclick="switchTab('knowledge')">
                    <span class="iconify text-xl" data-icon="fluent:brain-circuit-24-filled"></span>
                    <span>知識庫管理</span>
                </div>
                <div class="sidebar-link" onclick="switchTab('language')">
                    <span class="iconify text-xl" data-icon="fluent:local-language-24-filled"></span>
                    <span>多語言管理</span>
                </div>
            </nav>
            <div class="p-4 border-t border-gray-200">
                <button onclick="logout()" class="flex items-center gap-2 text-red-600 hover:text-red-800 transition-colors px-4 py-2 w-full">
                    <span class="iconify" data-icon="fluent:sign-out-24-filled"></span>
                    <span>登出</span>
                </button>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 overflow-y-auto p-8">
            
            <!-- Knowledge Base Section -->
            <div id="tab-knowledge" class="max-w-5xl mx-auto">
                <header class="mb-8">
                    <h2 class="text-2xl font-bold text-gray-800">知識庫管理</h2>
                    <p class="text-gray-500">上傳公司內部資料，讓 Vizzle 萬事通實時學習。</p>
                </header>

                <div class="glass-panel p-6 mb-8">
                    <div id="upload-zone" class="border-2 border-dashed border-[#6b3d92]/30 rounded-xl p-12 text-center transition-all hover:border-[#6b3d92] hover:bg-[#6b3d92]/5 cursor-pointer bg-gray-50">
                        <input type="file" id="file-input" multiple accept=".pdf,.xls,.xlsx,.html,.htm,.doc,.docx,.txt,.json,.csv" class="hidden">
                        <span class="iconify text-5xl text-[#6b3d92]/50 mb-4 mx-auto block" data-icon="fa-solid:cloud-arrow-up"></span>
                        <p class="text-gray-700 font-medium mb-2">拖放文件到這裡，或點擊選擇文件</p>
                        <p class="text-sm text-gray-400">支援 PDF, Excel, Word, HTML, TXT 等格式</p>
                    </div>
                </div>

                <div class="glass-panel p-6">
                    <!-- Toolbar -->
                    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <div class="flex items-center gap-3 w-full md:w-auto">
                            <div class="relative w-full md:w-64">
                                <span class="iconify absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" data-icon="fa-solid:search"></span>
                                <input type="text" id="kb-search" placeholder="搜索文件..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#6b3d92] outline-none text-sm" onkeyup="handleKBSearch(this.value)">
                            </div>
                            <select id="kb-filter-type" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#6b3d92] outline-none" onchange="handleKBFilter(this.value)">
                                <option value="all">所有类型</option>
                                <option value="document">文档 (PDF/Doc/Txt)</option>
                                <option value="data">数据 (Excel/CSV/JSON)</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-3">
                            <span id="kb-stats" class="text-sm text-gray-500">0 个文件</span>
                            <button id="btn-batch-delete" onclick="batchDeleteFiles()" class="hidden flex items-center gap-2 bg-red-50 text-red-600 hover:bg-red-100 px-3 py-2 rounded-lg text-sm transition-colors">
                                <span class="iconify" data-icon="fa-solid:trash-alt"></span>
                                <span>批量删除</span>
                            </button>
                            <button onclick="clearKnowledgeBase()" class="text-sm text-gray-400 hover:text-red-500 underline">清空全部</button>
                        </div>
                    </div>

                    <!-- File Table -->
                    <div class="overflow-x-auto rounded-lg border border-gray-200">
                        <table class="w-full text-sm text-left text-gray-500">
                            <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th scope="col" class="p-4 w-4">
                                        <div class="flex items-center">
                                            <input id="kb-select-all" type="checkbox" class="w-4 h-4 text-[#6b3d92] bg-gray-100 border-gray-300 rounded focus:ring-[#6b3d92]" onclick="toggleSelectAll()">
                                        </div>
                                    </th>
                                    <th scope="col" class="px-6 py-3 cursor-pointer hover:bg-gray-100" onclick="sortKB('name')">
                                        文件名 <span class="sort-icon iconify inline ml-1" data-icon="fa-solid:sort"></span>
                                    </th>
                                    <th scope="col" class="px-6 py-3 w-32 cursor-pointer hover:bg-gray-100" onclick="sortKB('size')">
                                        大小 <span class="sort-icon iconify inline ml-1" data-icon="fa-solid:sort"></span>
                                    </th>
                                    <th scope="col" class="px-6 py-3 w-32">类型</th>
                                    <th scope="col" class="px-6 py-3 w-48 cursor-pointer hover:bg-gray-100" onclick="sortKB('uploadedAt')">
                                        上传时间 <span class="sort-icon iconify inline ml-1" data-icon="fa-solid:sort"></span>
                                    </th>
                                    <th scope="col" class="px-6 py-3 w-24 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="kb-table-body">
                                <!-- Rows -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="flex items-center justify-between mt-4" id="kb-pagination">
                        <!-- Pagination logic here -->
                    </div>
                </div>
            </div>

            <!-- Language Management Section -->
            <div id="tab-language" class="max-w-6xl mx-auto hidden">
                <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">多語言管理</h2>
                        <p class="text-gray-500">直接編輯網站上的文字內容，修改後即時生效。</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="exportConfiguration()" class="btn-secondary flex items-center">
                            <span class="iconify inline mr-1" data-icon="fa-solid:download"></span>
                            導出配置
                        </button>
                        <button onclick="resetTranslations()" class="btn-danger text-sm">重置為預設</button>
                        <button onclick="saveTranslations()" class="btn-primary flex items-center gap-2">
                            <span class="iconify" data-icon="fa-solid:save"></span>
                            保存修改
                        </button>
                    </div>
                </header>
                
                <!-- Search/Filter -->
                <div class="mb-4">
                    <input type="text" id="lang-search" placeholder="搜索關鍵字或 Key..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#6b3d92] outline-none" onkeyup="filterTranslations()">
                </div>

                <div class="glass-panel overflow-hidden">
                    <div class="overflow-x-auto max-h-[70vh]">
                        <table class="trans-table">
                            <thead>
                                <tr>
                                    <th class="w-1/4 bg-gray-100 z-10">字段說明 (Key)</th>
                                    <th class="w-1/4 bg-gray-100 z-10">繁體中文 (zh-HK)</th>
                                    <th class="w-1/4 bg-gray-100 z-10">简体中文 (zh-CN)</th>
                                    <th class="w-1/4 bg-gray-100 z-10">English (en-US)</th>
                                </tr>
                            </thead>
                            <tbody id="trans-tbody">
                                <!-- Rows injected by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // ===================================
        // Authentication System (SHA-256 Secured)
        // ===================================
        
        const AUTH_HASH = {
            id: 'c775e7b757ede630cd0aa1113bd102661ab38829ca52a6422ab782862f268646', 
            pass: '00676420f67daec780a52bd853359d8779eb56d77bd837d9967266743820257e' 
        };

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        function checkAuth() {
            if (sessionStorage.getItem('vizzle_admin_auth') === 'true') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                initDashboard();
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputId = document.getElementById('admin-id').value;
            const inputPass = document.getElementById('admin-pass').value;
            
            const hashedId = await sha256(inputId);
            const hashedPass = await sha256(inputPass);

            if (hashedId === AUTH_HASH.id && hashedPass === AUTH_HASH.pass) {
                sessionStorage.setItem('vizzle_admin_auth', 'true');
                checkAuth();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
                const form = document.getElementById('login-screen').children[0];
                form.classList.add('animate-pulse');
                setTimeout(() => form.classList.remove('animate-pulse'), 500);
            }
        });

        function logout() {
            sessionStorage.removeItem('vizzle_admin_auth');
            location.reload();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            document.getElementById('tab-knowledge').classList.add('hidden');
            document.getElementById('tab-language').classList.add('hidden');
            document.getElementById('tab-' + tabName).classList.remove('hidden');
        }

        // ===================================
        // Init logic (KB & Lang)
        // ===================================
        function initDashboard() {
            // KB.load comes from assets/js/knowledge-base.js
            KB.load(renderKnowledgeList);
            loadLanguageEditor();
        }

        // ===================================
        // Knowledge Base UI Integration
        // ===================================
        
        let kbState = {
            searchQuery: '',
            filterType: 'all', // all, document, data, other
            sortField: 'uploadedAt',
            sortOrder: 'desc', // asc, desc
            currentPage: 1,
            itemsPerPage: 10,
            selectedFiles: new Set() // Set of strings: "local-0", "local-1", etc.
        };

        function renderKnowledgeList() {
            // Reset selection on reload (to avoid sync issues)
            kbState.selectedFiles.clear(); 
            updateBatchDeleteBtn();
            renderTable();
            updateSortUI();
        }

        function getProcessedFiles() {
            const kb = window.knowledgeBase;
            let allFiles = [];

            // 1. Server Files
            if (kb.serverFiles) {
                kb.serverFiles.forEach((f, idx) => {
                    allFiles.push({ ...f, source: 'server', originalIndex: idx, id: `server-${idx}` });
                });
            }

            // 2. Local Files
            if (kb.files) {
                kb.files.forEach((f, idx) => {
                    allFiles.push({ ...f, source: 'local', originalIndex: idx, id: `local-${idx}` });
                });
            }

            // Filter by Search
            if (kbState.searchQuery) {
                const q = kbState.searchQuery.toLowerCase();
                allFiles = allFiles.filter(f => f.name.toLowerCase().includes(q));
            }

            // Filter by Type
            if (kbState.filterType !== 'all') {
                allFiles = allFiles.filter(f => {
                    const type = (f.type || '').toLowerCase();
                    const name = f.name.toLowerCase();
                    if (kbState.filterType === 'document') {
                        return type.includes('pdf') || type.includes('word') || type.includes('text') || name.endsWith('.md') || name.endsWith('.txt') || name.endsWith('.doc') || name.endsWith('.docx');
                    } else if (kbState.filterType === 'data') {
                        return type.includes('excel') || type.includes('spreadsheet') || type.includes('csv') || type.includes('json') || name.endsWith('.xls') || name.endsWith('.xlsx');
                    } else if (kbState.filterType === 'other') {
                        // Invert logic of above
                        const isDoc = type.includes('pdf') || type.includes('word') || type.includes('text') || name.endsWith('.md') || name.endsWith('.txt') || name.endsWith('.doc') || name.endsWith('.docx');
                        const isData = type.includes('excel') || type.includes('spreadsheet') || type.includes('csv') || type.includes('json') || name.endsWith('.xls') || name.endsWith('.xlsx');
                        return !isDoc && !isData;
                    }
                    return true;
                });
            }

            // Sort
            allFiles.sort((a, b) => {
                let valA = a[kbState.sortField];
                let valB = b[kbState.sortField];
                
                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();

                if (valA < valB) return kbState.sortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return kbState.sortOrder === 'asc' ? 1 : -1;
                return 0;
            });

            return allFiles;
        }

        function renderTable() {
            const files = getProcessedFiles();
            const totalItems = files.length;
            const totalPages = Math.ceil(totalItems / kbState.itemsPerPage);
            
            // Adjust page if out of bounds
            if (kbState.currentPage > totalPages && totalPages > 0) kbState.currentPage = totalPages;
            if (kbState.currentPage < 1) kbState.currentPage = 1;

            const start = (kbState.currentPage - 1) * kbState.itemsPerPage;
            const end = start + kbState.itemsPerPage;
            const pageFiles = files.slice(start, end);

            const tbody = document.getElementById('kb-table-body');
            const stats = document.getElementById('kb-stats');
            
            stats.textContent = `${totalItems} 個文件`;

            if (totalItems === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-400">沒有找到文件</td></tr>`;
                renderPagination(0);
                return;
            }

            tbody.innerHTML = pageFiles.map(file => {
                const isSelected = kbState.selectedFiles.has(file.id);
                const isServer = file.source === 'server';
                const icon = KB.utils.getIcon(file.type);
                const size = file.size ? KB.utils.formatSize(file.size) : 'Unknown';
                const date = file.uploadedAt ? new Date(file.uploadedAt).toLocaleDateString() : '-';
                
                return `
                    <tr class="kb-row bg-white border-b hover:bg-gray-50 transition-colors ${isSelected ? 'selected' : ''}">
                        <td class="w-4 p-4">
                            <div class="flex items-center">
                                <input type="checkbox" class="kb-checkbox w-4 h-4 text-[#6b3d92] bg-gray-100 border-gray-300 rounded focus:ring-[#6b3d92]" 
                                    ${isServer ? 'disabled title="系統文件不可刪除"' : ''}
                                    ${isSelected ? 'checked' : ''}
                                    onchange="toggleFileSelection('${file.id}')">
                            </div>
                        </td>
                        <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">
                            <div class="flex items-center gap-2">
                                <span class="iconify text-lg text-gray-500" data-icon="${icon}"></span>
                                <span class="truncate max-w-xs" title="${file.name}">${file.name}</span>
                                ${isServer ? '<span class="px-2 py-0.5 rounded text-xs bg-blue-100 text-blue-800 ml-2">系統</span>' : ''}
                            </div>
                        </td>
                        <td class="px-6 py-4">${size}</td>
                        <td class="px-6 py-4 truncate max-w-[150px]" title="${file.type}">${file.type || 'Unknown'}</td>
                        <td class="px-6 py-4">${date}</td>
                        <td class="px-6 py-4 text-center">
                            ${!isServer ? `
                            <button onclick="deleteSingleFile('${file.id}')" class="font-medium text-red-600 hover:underline hover:text-red-800">刪除</button>
                            ` : '<span class="text-gray-300 cursor-not-allowed">鎖定</span>'}
                        </td>
                    </tr>
                `;
            }).join('');

            // Update Select All Checkbox state for current page
            const selectableFilesOnPage = pageFiles.filter(f => f.source !== 'server');
            const allSelected = selectableFilesOnPage.length > 0 && selectableFilesOnPage.every(f => kbState.selectedFiles.has(f.id));
            const selectAllBox = document.getElementById('kb-select-all');
            if (selectAllBox) {
                selectAllBox.checked = allSelected;
                selectAllBox.disabled = selectableFilesOnPage.length === 0;
            }

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('kb-pagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = `
                <span class="text-sm text-gray-700">
                    第 <span class="font-semibold text-gray-900">${kbState.currentPage}</span> / <span class="font-semibold text-gray-900">${totalPages}</span> 頁
                </span>
                <div class="inline-flex mt-2 xs:mt-0 gap-2">
                    <button onclick="changePage(-1)" class="flex items-center justify-center px-3 py-1 text-sm font-medium text-white bg-[#6b3d92] rounded hover:bg-[#5a327a] disabled:opacity-50 disabled:cursor-not-allowed" ${kbState.currentPage === 1 ? 'disabled' : ''}>
                        上一頁
                    </button>
                    <button onclick="changePage(1)" class="flex items-center justify-center px-3 py-1 text-sm font-medium text-white bg-[#6b3d92] rounded hover:bg-[#5a327a] disabled:opacity-50 disabled:cursor-not-allowed" ${kbState.currentPage === totalPages ? 'disabled' : ''}>
                        下一頁
                    </button>
                </div>
            `;
            container.innerHTML = html;
        }

        // --- Event Handlers ---

        function handleKBSearch(val) {
            kbState.searchQuery = val;
            kbState.currentPage = 1;
            renderTable();
        }

        function handleKBFilter(val) {
            kbState.filterType = val;
            kbState.currentPage = 1;
            renderTable();
        }

        function sortKB(field) {
            if (kbState.sortField === field) {
                kbState.sortOrder = kbState.sortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                kbState.sortField = field;
                kbState.sortOrder = 'asc';
            }
            renderTable();
            updateSortUI();
        }

        function updateSortUI() {
            const headers = document.querySelectorAll('th[onclick^="sortKB"]');
            headers.forEach(th => {
                // Parse field from onclick
                const match = th.getAttribute('onclick').match(/'(.*?)'/);
                if (!match) return;
                const field = match[1];
                
                const icon = th.querySelector('.sort-icon');
                
                // Reset style
                th.classList.remove('text-[#6b3d92]', 'bg-gray-100');
                if (icon) {
                    icon.style.opacity = '0.3';
                    icon.style.transform = 'rotate(0deg)';
                    icon.setAttribute('data-icon', 'fa-solid:sort');
                }

                // Apply active style
                if (field === kbState.sortField) {
                    th.classList.add('text-[#6b3d92]', 'bg-gray-100');
                    if (icon) {
                        icon.style.opacity = '1';
                        // Use arrow for active state
                        icon.setAttribute('data-icon', 'fa-solid:arrow-down');
                        if (kbState.sortOrder === 'asc') {
                            icon.style.transform = 'rotate(180deg)';
                        }
                    }
                }
            });
        }

        function changePage(delta) {
            kbState.currentPage += delta;
            renderTable();
        }

        function toggleFileSelection(id) {
            if (kbState.selectedFiles.has(id)) {
                kbState.selectedFiles.delete(id);
            } else {
                kbState.selectedFiles.add(id);
            }
            renderTable(); 
            updateBatchDeleteBtn();
        }

        function toggleSelectAll() {
            const files = getProcessedFiles();
            const start = (kbState.currentPage - 1) * kbState.itemsPerPage;
            const end = start + kbState.itemsPerPage;
            const pageFiles = files.slice(start, end).filter(f => f.source !== 'server');

            const allSelected = pageFiles.every(f => kbState.selectedFiles.has(f.id));
            
            if (allSelected) {
                pageFiles.forEach(f => kbState.selectedFiles.delete(f.id));
            } else {
                pageFiles.forEach(f => kbState.selectedFiles.add(f.id));
            }
            renderTable();
            updateBatchDeleteBtn();
        }

        function updateBatchDeleteBtn() {
            const btn = document.getElementById('btn-batch-delete');
            if (kbState.selectedFiles.size > 0) {
                btn.classList.remove('hidden');
                btn.querySelector('span:last-child').textContent = `批量刪除 (${kbState.selectedFiles.size})`;
            } else {
                btn.classList.add('hidden');
            }
        }

        function deleteSingleFile(id) {
            if (!confirm('確定要移除此文件嗎？')) return;
            const index = parseInt(id.split('-')[1]);
            KB.remove(index, renderKnowledgeList);
        }

        function batchDeleteFiles() {
            if (!confirm(`確定要刪除選中的 ${kbState.selectedFiles.size} 個文件嗎？`)) return;
            
            // Get indices to remove (descending order)
            const indices = Array.from(kbState.selectedFiles)
                .map(id => parseInt(id.split('-')[1]))
                .sort((a, b) => b - a);

            const kb = window.knowledgeBase;
            indices.forEach(idx => {
                if (idx >= 0 && idx < kb.files.length) {
                    kb.files.splice(idx, 1);
                }
            });
            
            KB.save(() => {
                alert('批量刪除成功');
                renderKnowledgeList();
            });
        }

        function clearKnowledgeBase() {
            if(confirm('警告：這將清空所有知識庫數據，前台 AI 將無法回答基於文檔的問題。確定繼續？')) {
                KB.clear(renderKnowledgeList);
            }
        }

        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');

        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('border-[#6b3d92]', 'bg-[#6b3d92]/5'); });
        uploadZone.addEventListener('dragleave', () => { uploadZone.classList.remove('border-[#6b3d92]', 'bg-[#6b3d92]/5'); });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('border-[#6b3d92]', 'bg-[#6b3d92]/5');
            KB.addFiles(e.dataTransfer.files, (count) => {
                alert(`成功上傳 ${count} 個文件！`);
                renderKnowledgeList();
            });
        });
        uploadZone.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') fileInput.click();
        });
        fileInput.addEventListener('change', (e) => {
            KB.addFiles(e.target.files, (count) => {
                alert(`成功上傳 ${count} 個文件！`);
                renderKnowledgeList();
            });
        });

        // ===================================
        // Language Editor Logic
        // ===================================
        let currentTranslations = {};

        function getGroup(key) {
            // window.KEY_GROUPS comes from translations.js
            for (const prefix in window.KEY_GROUPS) {
                if (key.startsWith(prefix)) return window.KEY_GROUPS[prefix];
            }
            return "📝 其他內容";
        }

        function loadLanguageEditor() {
            const saved = localStorage.getItem('vizzle_custom_translations');
            // window.DEFAULT_TRANSLATIONS comes from translations.js
            currentTranslations = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(window.DEFAULT_TRANSLATIONS));
            renderTranslationTable();
        }

        function renderTranslationTable(filterText = "") {
            const tbody = document.getElementById('trans-tbody');
            tbody.innerHTML = '';

            const keys = Object.keys(window.DEFAULT_TRANSLATIONS['zh-HK']).sort();
            
            const groupedKeys = {};
            keys.forEach(key => {
                const desc = window.KEY_DESCRIPTIONS[key] || "";
                if (filterText && !key.toLowerCase().includes(filterText.toLowerCase()) && !desc.toLowerCase().includes(filterText.toLowerCase())) {
                    return;
                }

                const group = getGroup(key);
                if (!groupedKeys[group]) groupedKeys[group] = [];
                groupedKeys[group].push(key);
            });

            for (const groupName in groupedKeys) {
                const groupHeader = document.createElement('tr');
                groupHeader.innerHTML = `<td colspan="4" class="bg-gray-200 font-bold text-gray-700 py-2 px-4 border-b border-gray-300 mt-4 sticky top-10">${groupName}</td>`;
                tbody.appendChild(groupHeader);

                groupedKeys[groupName].forEach(key => {
                    const tr = document.createElement('tr');
                    
                    const tdKey = document.createElement('td');
                    tdKey.className = 'py-3 px-4 border-b border-gray-200 align-top bg-gray-50';
                    
                    const desc = window.KEY_DESCRIPTIONS[key] || key;
                    const keyHtml = `
                        <div class="flex flex-col">
                            <span class="text-sm font-semibold text-gray-800">${desc}</span>
                            <span class="font-mono text-xs text-gray-400 select-all mt-1 cursor-pointer hover:text-purple-600" title="Click to copy key">${key}</span>
                        </div>
                    `;
                    tdKey.innerHTML = keyHtml;
                    tr.appendChild(tdKey);

                    ['zh-HK', 'zh-CN', 'en-US'].forEach(lang => {
                        const td = document.createElement('td');
                        td.className = 'py-2 px-2 border-b border-gray-200 align-top';
                        
                        const input = document.createElement('textarea');
                        input.className = 'trans-input w-full p-2 border rounded text-sm focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all resize-y';
                        input.rows = 3;
                        input.value = currentTranslations[lang][key] || window.DEFAULT_TRANSLATIONS[lang][key] || '';
                        
                        input.addEventListener('change', (e) => {
                            currentTranslations[lang][key] = e.target.value;
                        });
                        
                        td.appendChild(input);
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                });
            }
        }

        function filterTranslations() {
            const text = document.getElementById('lang-search').value;
            renderTranslationTable(text);
        }

        function saveTranslations() {
            localStorage.setItem('vizzle_custom_translations', JSON.stringify(currentTranslations));
            alert('語言設定已保存！刷新前台頁面即可看到更改。');
        }

        function resetTranslations() {
            if(confirm('確定要重置所有語言翻譯為系統預設值嗎？')) {
                localStorage.removeItem('vizzle_custom_translations');
                loadLanguageEditor();
                alert('已重置為預設值。');
            }
        }

        function exportConfiguration() {
            const configData = JSON.stringify(currentTranslations, null, 4);
            const blob = new Blob([configData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vizzle_translations_config.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Init Check
        checkAuth();

    </script>
</body>
</html>
